[project]
name = "connector"
version = "0.1.0"
description = "Moves the user's own Garmin Connect data into open-wearables through its SDK sync endpoint"
requires-python = ">=3.12,<3.14"
dependencies = [
    "garminconnect>=0.3.17",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
connector = "connector.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "TID", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
